minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  # Ruff — format first, then lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-format
        types: [python]
      - id: ruff-check
        args: ["--fix"]
        types: [python]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.2
    hooks:
      - id: uv-lock
        files: '(pyproject\.toml|uv\.lock)$'

  - repo: local
    hooks:
      # Python type check — dmypy daemon
      - id: mypy
        name: mypy (daemon)
        entry: uv run --locked --extra dev -- dmypy run -- src/
        language: system
        files: '^(src/.*\.py|pyproject\.toml)$'
        pass_filenames: false
        require_serial: true

      # Python security scan — keep src/ as the local security boundary
      - id: bandit
        name: bandit (src)
        entry: uv run --locked --extra dev -- bandit -r src/ -c pyproject.toml
        language: system
        files: '^(src/.*\.py|pyproject\.toml)$'
        pass_filenames: false

      # Frontend lint — oxlint for fast whole-src checks
      - id: benchmark-frontend-lint
        name: benchmark frontend oxlint
        entry: pre-commit hazmat cd benchmark/viewer/frontend npm exec oxlint src --
        language: system
        files: '^benchmark/viewer/frontend/.*\.(ts|tsx|js|jsx)$'
        pass_filenames: false

      # Frontend format — keep source and root config files consistent
      - id: benchmark-frontend-format
        name: benchmark frontend prettier
        entry: pre-commit hazmat cd benchmark/viewer/frontend npm run format --
        language: system
        files: '^benchmark/viewer/frontend/'
        pass_filenames: false

      # Frontend spell check — catch obvious typos in source and config files
      - id: benchmark-frontend-spellcheck
        name: benchmark frontend cspell
        entry: pre-commit hazmat cd benchmark/viewer/frontend npm run spellcheck --
        language: system
        files: '^benchmark/viewer/frontend/'
        pass_filenames: false

      # Frontend full check — whole-project analysis, pre-push only
      - id: benchmark-frontend-full-check
        name: benchmark frontend full check
        entry: pre-commit hazmat cd benchmark/viewer/frontend npm run pre-push-check --
        language: system
        files: '^benchmark/viewer/frontend/'
        pass_filenames: false
        stages: [pre-push]
